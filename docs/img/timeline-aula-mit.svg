<g class="item kept" data-sentence-id="2"><title>0:15–0:17 · And I'm Gilbert Strang.</title><rect x="74.44" y="74" width="4.95" height="34" fill="#4c78a8"/></g>
<g class="item kept" data-sentence-id="3"><title>0:19–0:25 · The text for the course is this book, Introduction to Linear Algebra.</title><rect x="84.27" y="74" width="19.41" height="34" fill="#4c78a8"/></g>
<g class="item kept" data-sentence-id="4"><title>0:26–0:43 · And the course web page, which has got a lot of exercises from the past, MATLAB codes, the syllabus for the course is...</title><rect x="106.86" y="74" width="53.87" height="34" fill="#4c78a8"/></g>
<g class="item kept" data-sentence-id="6"><title>0:48–0:56 · And later we'll say which will give the web address for viewing these video tapes.</title><rect x="178.30" y="74" width="24.55" height="34" fill="#4c78a8"/></g>
<g class="item kept" data-sentence-id="7"><title>0:57–0:59 · OK, so what's in the first lecture?</title><rect x="205.39" y="74" width="5.77" height="34" fill="#4c78a8"/></g>
<g class="item kept" data-sentence-id="8"><title>1:00–1:12 · This is my plan, the fundamental problem of linear algebra, which is to solve a system of linear equations.</title><rect x="214.34" y="74" width="40.99" height="34" fill="#4c78a8"/></g>
<g class="item kept" data-sentence-id="9"><title>1:13–1:20 · So let's start with the case when we have some number of equations, say n equations and n unknowns.</title><rect x="257.80" y="74" width="21.57" height="34" fill="#4c78a8"/></g>
<g class="item kept" data-sentence-id="10"><title>1:21–1:23 · So an equal number of equations and unknowns.</title><rect x="282.22" y="74" width="7.04" height="34" fill="#4c78a8"/></g>
<g class="item kept" data-sentence-id="11"><title>1:23–1:26 · That's the normal, nice case.</title><rect x="289.77" y="74" width="7.11" height="34" fill="#4c78a8"/></g>
<g class="item kept" data-sentence-id="12"><title>1:26–1:36 · And what I want to do is with examples, of course, to describe first what I call the row picture.</title><rect x="296.88" y="74" width="33.25" height="34" fill="#4c78a8"/></g>
<g class="item kept" data-sentence-id="13"><title>1:37–1:40 · That's the picture of one equation at a time.</title><rect x="332.41" y="74" width="9.96" height="34" fill="#4c78a8"/></g>
<g class="item kept" data-sentence-id="14"><title>1:40–1:46 · It's the picture you've seen before in two by two equations where lines meet.</title><rect x="343.38" y="74" width="17.45" height="34" fill="#4c78a8"/></g>
<g class="item kept" data-sentence-id="15"><title>1:46–1:48 · So in a minute you'll see lines meeting.</title><rect x="361.40" y="74" width="6.98" height="34" fill="#4c78a8"/></g>
<g class="item kept" data-sentence-id="16"><title>1:49–1:54 · The second picture, I'll put a star beside that, because that's such an important one.</title><rect x="370.92" y="74" width="16.62" height="34" fill="#4c78a8"/></g>
<g class="item kept" data-sentence-id="17"><title>1:54–2:00 · And maybe new to you is the picture a column at a time.</title><rect x="387.54" y="74" width="19.10" height="34" fill="#4c78a8"/></g>
<g class="item kept" data-sentence-id="18"><title>2:01–2:04 · And those are the rows and columns of a matrix.</title><rect x="408.42" y="74" width="10.91" height="34" fill="#4c78a8"/></g>
<g class="item kept" data-sentence-id="19"><title>2:05–2:12 · So the third, the algebra way to look at the problem is the matrix form in using a matrix that I'll call a.</title><rect x="421.42" y="74" width="23.98" height="34" fill="#4c78a8"/></g>
<g class="item kept" data-sentence-id="20"><title>2:13–2:16 · OK, so can I do an example?</title><rect x="448.01" y="74" width="9.90" height="34" fill="#4c78a8"/></g>
<g class="item kept" data-sentence-id="21"><title>2:17–2:24 · The whole semester will be examples and then see what's going on with the example.</title><rect x="459.81" y="74" width="23.86" height="34" fill="#4c78a8"/></g>
