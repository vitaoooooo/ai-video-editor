<g class="item kept" data-sentence-id="27"><title>2:57–3:00 · The matrix that involves these numbers.</title><rect x="587.27" y="74" width="8.12" height="34" fill="#4c78a8"/></g>
<g class="item kept" data-sentence-id="28"><title>3:00–3:04 · A matrix is just a rectangular array of numbers.</title><rect x="596.79" y="74" width="12.05" height="34" fill="#4c78a8"/></g>
<g class="item kept" data-sentence-id="29"><title>3:04–3:07 · Here it's two rows and two columns.</title><rect x="609.54" y="74" width="8.44" height="34" fill="#4c78a8"/></g>
<g class="item kept" data-sentence-id="30"><title>3:07–3:15 · So 2 and minus 1 in the first row, minus 1 and 2 in the second row, that's the matrix.</title><rect x="620.13" y="74" width="23.03" height="34" fill="#4c78a8"/></g>
