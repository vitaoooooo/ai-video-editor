<g class="item kept" data-sentence-id="24"><title>2:30–2:43 · So let me take 2x minus y equals 0, let's say, and minus x plus, say, 2y equals 3.</title><rect x="501.11" y="74" width="43.08" height="34" fill="#4c78a8"/></g>
